[package]
name = "octofhir-sof"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SQL on FHIR 3.0: ViewDefinitions in memory or as PostgreSQL / DuckDB SQL, SQLQuery / SQLView jobs, terminology relations"
readme = "../../README.md"
keywords = ["fhir", "sql-on-fhir", "healthcare", "viewdefinition", "fhirpath"]
categories = ["database", "parser-implementations"]
documentation = "https://docs.rs/octofhir-sof"
# The vendored conformance suite and fixtures are large and test-only; keep them
# out of the published package.
exclude = ["tests/spec/**", "tests/extra/**"]

[dependencies]
# FHIR
octofhir-fhirpath = { workspace = true }
octofhir-fhir-model = { workspace = true }

# Database (feature `postgres`)
sqlx-core = { workspace = true, optional = true }
sqlx-postgres = { workspace = true, optional = true }

# SQLQuery content (base64) and terminology filters (regex)
base64 = { workspace = true }
regex = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# SQL check on the PostgreSQL syntax tree (feature `guard`)
banshee_parser = { workspace = true, optional = true }
banshee_lexer = { workspace = true, optional = true }
banshee_syntax = { workspace = true, optional = true }

# Embedded SQL executor (feature `duckdb`)
duckdb = { workspace = true, optional = true }

# Output formats
csv = { workspace = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
chrono = { workspace = true, features = ["clock"] }

# Artifact catalogs: version order, expansion identity, package archives
# (feature `packages`)
semver = { workspace = true }
uuid = { workspace = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-util"] }
futures-util = { workspace = true }
pin-project-lite = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Tracing
tracing = { workspace = true }

[features]
default = []
# Execute generated SQL against PostgreSQL with the bundled sqlx `ViewRunner`.
# SQL generation itself needs no feature; hosts with their own pool implement
# `SqlExecutor` instead.
postgres = ["dep:sqlx-core", "dep:sqlx-postgres"]
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]
# `HttpTerminologyProvider` (+ `CachedTerminologyProvider`) for resolving
# memberOf/subsumes/translate against a remote FHIR terminology server.
tx-remote = ["octofhir-fhir-model/http-client", "octofhir-fhir-model/caching"]
# `guard::check`: the static check of SQL a host runs on its own PostgreSQL.
guard = ["dep:banshee_parser", "dep:banshee_lexer", "dep:banshee_syntax"]
# `DuckDbJob`: SQLQuery jobs in an embedded DuckDB (bundled, no server).
duckdb = ["dep:duckdb"]
# `Catalog::load` of FHIR package archives (`.tgz`).
packages = ["dep:flate2", "dep:tar"]

[dev-dependencies]
bytes = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-test = "0.4.6"
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
