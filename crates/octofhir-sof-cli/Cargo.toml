[package]
name = "octofhir-sof-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Command-line interface for octofhir-sof (SQL on FHIR)"
readme = "../../README.md"
keywords = ["fhir", "sql-on-fhir", "healthcare", "cli", "viewdefinition"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "octofhir-sof"
path = "src/main.rs"
# The binary shares its name with the library; avoid overwriting its rustdoc.
doc = false

[dependencies]
octofhir-sof = { workspace = true }
octofhir-sof-lint = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
annotate-snippets = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
sqlx-postgres = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
# `run --db` stays available in a default install.
default = ["postgres", "duckdb", "packages", "guard"]
postgres = ["octofhir-sof/postgres", "dep:sqlx-postgres"]
parquet = ["octofhir-sof/parquet", "dep:tracing-subscriber"]
# `run --tx <url>`: resolve memberOf/subsumes/translate against a terminology server.
tx-remote = ["octofhir-sof/tx-remote"]
# `sql run` / `sql export` / `sql check` in an embedded DuckDB.
duckdb = ["octofhir-sof/duckdb"]
# `sql check` reports whether the PostgreSQL SQL passes the server-side check.
guard = ["octofhir-sof/guard"]
# `--artifacts` FHIR package archives (.tgz).
packages = ["octofhir-sof/packages"]

[dev-dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { workspace = true }
bytes = { workspace = true }
sqlx-core = { workspace = true }
