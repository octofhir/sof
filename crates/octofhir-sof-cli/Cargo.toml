[package]
name = "octofhir-sof-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Command-line interface for octofhir-sof (SQL on FHIR)"
readme = "../../README.md"
keywords = ["fhir", "sql-on-fhir", "healthcare", "cli", "viewdefinition"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "octofhir-sof"
path = "src/main.rs"
# The binary shares its name with the library; avoid overwriting its rustdoc.
doc = false

[dependencies]
octofhir-sof = { workspace = true }
octofhir-sof-lint = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
annotate-snippets = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
sqlx-postgres = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
default = []
parquet = ["octofhir-sof/parquet", "dep:tracing-subscriber"]

[dev-dependencies]
arrow = { workspace = true }
parquet = { workspace = true }
bytes = { workspace = true }
sqlx-core = { workspace = true }
