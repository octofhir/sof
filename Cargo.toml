[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/octofhir/sof"
homepage = "https://github.com/octofhir/sof"
authors = ["OctoFHIR Team <funyloony@gmail.com>"]

[workspace.dependencies]
# Internal (version is required so dependent crates carry a real requirement
# when published to crates.io; keep in sync with workspace.package.version)
octofhir-sof = { path = "crates/octofhir-sof", version = "0.3.5" }
octofhir-sof-lint = { path = "crates/octofhir-sof-lint", version = "0.3.5" }

# Ecosystem (crates.io)
octofhir-fhirpath = { version = "0.5.5", default-features = false }
octofhir-fhirschema = { version = "0.3.35", default-features = false }
octofhir-canonical-manager = { version = "0.2.11", default-features = false, features = ["sqlite"] }
# TerminologyProvider trait (memberOf/subsumes/translate in views). The HTTP
# provider sits behind its `http-client` feature, enabled only by `tx-remote`.
octofhir-fhir-model = { version = "0.1.19", default-features = false }

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
annotate-snippets = "0.12.16"

# Lint engine (banshee, published on crates.io)
banshee_hir = "0.2.7"
banshee_parser = "0.2.7"
banshee_lexer = "0.2.7"
banshee_syntax = "0.2.7"
banshee_format = "0.2.7"

# Libraries (SQLQuery content) and terminology filters
base64 = "0.23.1"
regex = "1.13.1"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Async
async-trait = "0.1.92"
# Crates name the tokio features they use; the library needs only a
# current-thread runtime and the async write traits.
tokio = { version = "1.53.3", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
pin-project-lite = "0.2.17"

# Database
sqlx-core = { version = "0.9.0", default-features = false, features = [
    "_rt-tokio",
    "json",
] }
sqlx-postgres = { version = "0.9.0", default-features = false, features = [
    "json",
] }

# Output formats
csv = "1.4.0"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2-zlib-rs", "simdutf8"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
bytes = "1.12.1"

# Embedded executor (feature `duckdb`)
duckdb = { version = "~1.10506.1", features = ["bundled", "json"] }

# Catalogs
semver = "1.0.28"
uuid = { version = "1.29.0", features = ["v4"] }
flate2 = "1.1.10"
tar = "0.4.46"

# Error handling
thiserror = "2.0.21"

# Tracing
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
