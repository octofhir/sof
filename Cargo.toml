[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/octofhir/sof"
homepage = "https://github.com/octofhir/sof"
authors = ["OctoFHIR Team <funyloony@gmail.com>"]

[workspace.dependencies]
# Internal (version is required so dependent crates carry a real requirement
# when published to crates.io; keep in sync with workspace.package.version)
octofhir-sof = { path = "crates/octofhir-sof", version = "0.1.3" }
octofhir-sof-lint = { path = "crates/octofhir-sof-lint", version = "0.1.3" }

# Ecosystem (crates.io)
octofhir-fhirpath = { version = "0.4.56", default-features = false }
octofhir-fhirschema = "0.3.29"
octofhir-canonical-manager = "0.2.3"

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
annotate-snippets = "0.12.16"

# Lint engine (banshee, published on crates.io)
banshee_hir = "0.2.3"
banshee_parser = "0.2.3"
banshee_syntax = "0.2.3"
banshee_format = "0.2.3"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Async
async-trait = "0.1.92"
tokio = { version = "1.53.3", features = ["full", "io-util"] }
futures-util = "0.3.34"
pin-project-lite = "0.2.17"

# Database
sqlx-core = { version = "0.9.0", default-features = false, features = [
    "_rt-tokio",
    "json",
] }
sqlx-postgres = { version = "0.9.0", default-features = false, features = [
    "json",
] }

# Output formats
csv = "1.4.0"
arrow = { version = "60.0.0" }
parquet = { version = "60.0.0", features = ["arrow", "snap", "zstd", "lz4", "flate2"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
bytes = "1.12.1"

# Error handling
thiserror = "2.0.21"

# Tracing
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
